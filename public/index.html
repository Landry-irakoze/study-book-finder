<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Book Finder</title>
  <meta name="description" content="Find textbooks and course reading from Google Books, filter by language and availability, and keep a reading list.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-row">
      <div>
        <h1>Study Book Finder</h1>
        <p class="lead">Search Google Books for textbooks and course reading, then save what you want to read.</p>
      </div>
      <button type="button" id="shelf-toggle" class="btn btn-ghost" aria-expanded="false" aria-controls="shelf">
        Reading list <span id="shelf-count" class="count">0</span>
      </button>
    </div>
  </header>

  <main class="wrap">
    <form id="search-form" class="search" role="search" novalidate>
      <label class="field field-grow">
        <span>Search by title, author or topic</span>
        <input id="q" name="q" type="search" maxlength="100" autocomplete="off" placeholder="Database systems" required>
      </label>
      <label class="field">
        <span>Language</span>
        <select id="lang" name="lang">
          <option value="">Any language</option>
          <option value="en">English</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="pt">Portuguese</option>
          <option value="sw">Swahili</option>
        </select>
      </label>
      <label class="field">
        <span>Availability</span>
        <select id="filter" name="filter">
          <option value="">All books</option>
          <option value="free-ebooks">Free e-books</option>
          <option value="ebooks">E-books</option>
          <option value="full">Fully viewable</option>
          <option value="partial">Preview available</option>
        </select>
      </label>
      <label class="field">
        <span>Sort by</span>
        <select id="sort" name="sort">
          <option value="relevance">Best match</option>
          <option value="newest">Newest first</option>
          <option value="rating">Highest rated (this page)</option>
          <option value="title">Title A to Z (this page)</option>
        </select>
      </label>
      <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <div id="narrow-row" class="narrow" hidden>
      <label class="field field-grow">
        <span>Narrow these results</span>
        <input id="narrow" type="search" autocomplete="off" placeholder="Type part of a title or author">
      </label>
      <p id="summary" class="summary" aria-live="polite"></p>
    </div>

    <div id="status" class="status" role="status" aria-live="polite"></div>
    <ul id="results" class="results"></ul>

    <nav id="pager" class="pager" aria-label="Result pages" hidden>
      <button type="button" id="prev" class="btn btn-ghost">Previous page</button>
      <span id="page-label"></span>
      <button type="button" id="next" class="btn btn-ghost">Next page</button>
    </nav>
  </main>

  <aside id="shelf" class="shelf" aria-label="Reading list" hidden>
    <div class="shelf-head">
      <h2>Reading list</h2>
      <button type="button" id="shelf-close" class="btn btn-ghost">Close</button>
    </div>
    <ul id="shelf-items" class="shelf-items"></ul>
    <p id="shelf-empty" class="muted">Nothing saved yet. Use "Save to list" on any book.</p>
  </aside>

  <footer class="wrap foot">
    <p>Book data from the <a href="https://developers.google.com/books" target="_blank" rel="noopener noreferrer">Google Books API</a>.</p>
    <p id="served-by" class="muted"></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
