# Add to the END of /etc/haproxy/haproxy.cfg on Lb01, below the global and defaults sections.
# Remove any older frontend that already binds port 80 first (two frontends cannot share a port).
frontend study_books_front
    bind *:80
    mode http
    default_backend study_books_back

backend study_books_back
    mode http
    balance roundrobin
    option forwardfor
    option httpchk GET /api/health
    http-check expect status 200
    server web-01 35.177.168.238:80 check
    server web-02 3.8.119.54:80 check
