# Append to /etc/haproxy/haproxy.cfg on Lb01 (replace the IP placeholders)
frontend study_books_front
    bind *:80
    mode http
    default_backend study_books_back

backend study_books_back
    mode http
    balance roundrobin
    option forwardfor
    option httpchk GET /api/health
    http-check expect status 200
    server web-01 <WEB01_IP>:80 check
    server web-02 <WEB02_IP>:80 check
